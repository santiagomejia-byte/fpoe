<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <title>Facelets Hello Greeting</title>
    </h:head>

    <h:body>
        <h:form id="formulario"> 
            <p:card style="width: 35rem; margin-bottom: 2em">
                <f:facet name="title">Gestionar Asignaturas</f:facet>

                <p:card style="width: 35rem; margin-bottom: 2em">
                    <h:panelGrid columns="3">
                        <p:outputLabel for="txfCodigo" value="Codigo : " />
                        <p:inputText id="txfCodigo" value="#{asignCtrl.asignatura.codigo}" required="true"></p:inputText>
                        <p:message for="txfCodigo"/>

                        <p:outputLabel for="txfNombre" value="Nombre : " />
                        <p:inputText id="txfNombre" value="#{asignCtrl.asignatura.nombre}" required="true"></p:inputText>
                        <p:message for="txfNombre"/>

                        <p:outputLabel for="txfCreditos" value="Créditos : " /> 
                        <p:inputText id="txfCreditos" value="#{asignCtrl.asignatura.creditos}" required="true"></p:inputText>
                        <p:message for="txfCreditos"/>

                        <p:outputLabel for="txfIntensidad" value="Intensidad : " /> 
                        <p:inputText id="txfIntensidad" value="#{asignCtrl.asignatura.intensidad}" required="true"></p:inputText>
                        <p:message for="txfIntensidad"/>
                    </h:panelGrid>
                </p:card>

                <p:messages id="mensajes" globalOnly="true" closable="true" />


                <f:facet name="footer">
                    <p:commandButton icon="pi pi-check" value="Save"
                                     action="#{asignCtrl.guardar()}"
                                     process="@form"
                                     update="@form table"
                                     
                                     
                                     />
                    <p:commandButton icon="pi pi-times" value="Cancel"
                                     styleClass="ui-button-secondary"
                                     style="margin-left: .5em"
                                     action="#{asignCtrl.cancelar()}"
                                     process="@this"
                                     update="mensajes txfCodigo txfNombre txfCreditos txfIntensidad"
                                     />
                </f:facet> 



            </p:card>
        </h:form>
            <p:dataTable id="table" value="#{asignCtrl.asignaturas}" var="obj">
                <p:column headerText="Codigo">#{obj.codigo}</p:column>
                <p:column headerText="Nombre">#{obj.nombre}</p:column>
                <p:column headerText="Intensidad">#{obj.intensidad}</p:column>
                <p:column headerText="Creditos">#{obj.creditos}</p:column>
            </p:dataTable>
        
    </h:body>
</html>
