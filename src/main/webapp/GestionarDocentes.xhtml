<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
// comentario para volver a subir
    <h:head>
        <title>Facelets Hello Greeting</title>
    </h:head>

    <h:body>
        <h:form>
            <p:card style="width: 35rem; margin-bottom: 2em">

                <f:facet name="title">Gestionar Docentes</f:facet>

                <h:panelGrid columns="2">

                    <p:outputLabel for="nuip" value="Documento:" />
                    <p:inputText id="nuip"/>

                    <p:outputLabel for="nombres" value="Nombres:" />
                    <p:inputText id="nombres"/>

                    <p:outputLabel for="apellidos" value="Apellidos:" />
                    <p:inputText id="apellidos"/>

                    <p:outputLabel for="genero" value="Género:" />
                    <p:selectOneMenu id="genero">
                        <f:selectItem itemLabel="Seleccione" itemValue="" />
                        <f:selectItem itemLabel="Masculino" itemValue="MASCULINO" />
                        <f:selectItem itemLabel="Femenino" itemValue="FEMENINO" />
                    </p:selectOneMenu>

                    <p:outputLabel for="profesion" value="Profesión:" />
                    <p:inputText id="profesion"/>

                </h:panelGrid>

                <f:facet name="footer">
                    <p:commandButton icon="pi pi-check" value="Save"/>
                    <p:commandButton icon="pi pi-times" value="Cancel"
                                     styleClass="ui-button-secondary"
                                     style="margin-left: .5em"/>
                </f:facet> 

            </p:card>
        </h:form>
    </h:body>
</html>
